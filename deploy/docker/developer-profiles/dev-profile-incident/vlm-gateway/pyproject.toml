[project]
name = "vlm-gateway"
version = "0.1.0"
description = "Thin proxy for NVIDIA-hosted OpenAI-compatible LLM/VLM inference"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    # HTTP client + server
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.28,<1",
    # Config + schema
    "python-dotenv>=1.0,<2",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.uv]
# App, not a distributable library - uv installs the dependencies but does not
# build/install this project itself (so the Docker build needs only
# pyproject.toml + uv.lock).
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "SIM"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]