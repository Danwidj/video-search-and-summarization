# vlm-gateway - Thin proxy for NVIDIA-hosted OpenAI-compatible LLM/VLM inference.
# VM-deploy only: local development runs the app natively (uv run uvicorn app:app --port 8600),
# never through this compose file. See README.md for the local dev loop.

services:

  vlm-gateway:
    build:
      context: ${VSS_APPS_DIR}/developer-profiles/dev-profile-incident/vlm-gateway
      dockerfile: Dockerfile
    container_name: vss-vlm-gateway
    profiles: ["bp_developer_search_2d"]
    network_mode: "host"
    environment:
      # NVIDIA-hosted OpenAI-compatible endpoint base URL.
      # Default points to the team's switchyard endpoint.
      - VLM_GATEWAY_BASE_URL=${VLM_GATEWAY_BASE_URL:-https://switchyard-13doh4lsz.brevlab.com/v1}
      # API key for the upstream endpoint. MUST be set in generated.env.remote for VM deploy.
      # Empty here - the real value is injected at deploy time.
      - VLM_GATEWAY_API_KEY=${VLM_GATEWAY_API_KEY:-}
      # Host port the gateway listens on (compose maps it via host networking).
      - VLM_GATEWAY_PORT=${VLM_GATEWAY_PORT:-8600}
    restart: unless-stopped