# Developer profile: incident search & reporting capstone.
#
# Overrides only for the services this profile still runs or scales down.
#
# Disable SDRC services: sdr-controller is NVIDIA's stream router for dynamically
# registering live RTSP cameras. Unused in dev-profile-incident (which uses file
# upload + analyze) and port-clashes with streamprocessing on port 10000.
# Re-enable when live RTSP camera routing is needed.

services:
  init-dirs:
    scale: 0
  render-config:
    scale: 0
  wdm-env-from-config:
    scale: 0
  wait-for-redis:
    scale: 0
  wait-for-docker-workloads:
    scale: 0
  sdr-controller:
    scale: 0

  # GPU pinning: keep the appliances that use the nvidia runtime on GPU 0, so
  # GPU 1 stays untouched for co-tenant training workloads.
  nvstreamer-2d-fusion:
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0

  perception-2d-fusion:
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0

  # Restart policy: unless-stopped, so a deliberate 'docker compose stop' stays
  # stopped across system reboots.
  kafka:
    restart: unless-stopped

  phoenix:
    restart: unless-stopped

  elasticsearch:
    restart: unless-stopped

  logstash:
    restart: unless-stopped

  vss-video-analytics-api-fusion:
    restart: unless-stopped
