# Developer profile: incident search & reporting capstone.
#
# Disable SDRC services: sdr-controller is NVIDIA's stream router for dynamically
# registering live RTSP cameras. Unused in dev-profile-incident (which uses file
# upload + analyze) and port-clashes with streamprocessing on port 10000.
# Re-enable when live RTSP camera routing is needed.

services:
  init-dirs:
    scale: 0
  render-config:
    scale: 0
  wdm-env-from-config:
    scale: 0
  wait-for-redis:
    scale: 0
  wait-for-docker-workloads:
    scale: 0
  sdr-controller:
    scale: 0

  # Restart policy overrides: set unless-stopped for all persistent appliance
  # and profile services so a deliberate 'docker compose stop' stays stopped
  # across system reboots.
  redis:
    restart: unless-stopped

  vss-haproxy-ingress:
    restart: unless-stopped

  centralizedb:
    restart: unless-stopped

  vst-ingress:
    restart: unless-stopped

  streamprocessing-ms:
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: unless-stopped

  kafka:
    restart: unless-stopped

  nvstreamer-2d-fusion:
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: unless-stopped

  phoenix:
    restart: unless-stopped

  vss-ui:
    restart: unless-stopped

  elasticsearch:
    restart: unless-stopped

  logstash:
    restart: unless-stopped

  kibana:
    restart: unless-stopped

  vss-video-analytics-api-fusion:
    restart: unless-stopped

  vss-search-analytics-2d-fusion:
    restart: unless-stopped
