# Developer profile: incident search and reporting.
# Overrides only for the stock services this profile scales down or tunes.

services:
  # Scaled to 0: the stock init and wait helpers, and sdr-controller (NVIDIA's router for
  # live RTSP cameras; this profile uploads files and calls /analyze, and sdr-controller
  # clashes with streamprocessing on port 10000). Scale it back up for live cameras.
  init-dirs:
    scale: 0
  render-config:
    scale: 0
  wdm-env-from-config:
    scale: 0
  wait-for-redis:
    scale: 0
  wait-for-docker-workloads:
    scale: 0
  sdr-controller:
    scale: 0

  # GPU 0 only: GPU 1 stays free for co-tenant training workloads.
  nvstreamer-2d-fusion:
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0

  perception-2d-fusion:
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0

  # unless-stopped: a deliberate 'docker compose stop' stays stopped across reboots.
  kafka:
    restart: unless-stopped

  phoenix:
    restart: unless-stopped

  elasticsearch:
    restart: unless-stopped

  logstash:
    restart: unless-stopped

  vss-video-analytics-api-fusion:
    restart: unless-stopped
